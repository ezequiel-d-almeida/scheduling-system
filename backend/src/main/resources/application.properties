# Aplicação
spring.application.name=scheduling-api
server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/scheduling_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Security. The initial administrator is provisioned only when both environment
# variables are supplied and no administrator account exists yet.
app.security.initial-username=${ADMIN_USERNAME:}
app.security.initial-password=${ADMIN_PASSWORD:}
app.security.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
app.security.login-max-attempts=${APP_LOGIN_MAX_ATTEMPTS:5}
app.security.login-attempt-window=PT15M

server.servlet.session.timeout=8h
server.servlet.session.cookie.name=SCHEDULING_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${APP_SESSION_COOKIE_SAME_SITE:Lax}
